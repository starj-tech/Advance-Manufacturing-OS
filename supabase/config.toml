# Supabase config for AETHER-OS local dev.
# Generated by `supabase init` at PR #1; pruned to the surface we use.

project_id = "aether-os"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:1420"
additional_redirect_urls = ["http://localhost:1420", "http://tauri.localhost"]
jwt_expiry = 3600
enable_signup = false # tenants are provisioned via admin flow only
minimum_password_length = 12

[auth.email]
enable_confirmations = true
secure_password_change = true

[edge_runtime]
enabled = true
inspector_port = 8083
policy = "oneshot"

[functions]
verify_jwt = true

[experimental]
webhooks = []
