[package]
name = "aether-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "aether_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-store = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

aether-core = { path = "../../../crates/aether-core" }
aether-db = { path = "../../../crates/aether-db" }
aether-sync = { path = "../../../crates/aether-sync" }
aether-crypto = { path = "../../../crates/aether-crypto" }
aether-protocols = { path = "../../../crates/aether-protocols" }
aether-opcua = { path = "../../../crates/aether-opcua" }
aether-mqtt = { path = "../../../crates/aether-mqtt" }
aether-modules = { path = "../../../crates/aether-modules" }
aether-safety = { path = "../../../crates/aether-safety" }
aether-telemetry = { path = "../../../crates/aether-telemetry" }
aether-discovery = { path = "../../../crates/aether-discovery" }
aether-healing = { path = "../../../crates/aether-healing" }
aether-hedging = { path = "../../../crates/aether-hedging" }
aether-money = { path = "../../../crates/aether-money" }
aether-industry = { path = "../../../crates/aether-industry" }
aether-compliance = { path = "../../../crates/aether-compliance" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
