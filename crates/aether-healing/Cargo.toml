[package]
name = "aether-healing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
aether-core = { path = "../aether-core" }
aether-sync = { path = "../aether-sync", optional = true }
aether-telemetry = { path = "../aether-telemetry", optional = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[features]
default = ["sync-bridge", "telemetry-bridge"]
# Enables `From<aether_sync::MetricsSymptom> for Symptom` —
# the V40 bridge that lets the dispatcher consume the
# sync-metrics symptom stream directly.
sync-bridge = ["dep:aether-sync"]
# Enables `From<aether_telemetry::BreakerSymptom> for Symptom`
# — the V41 bridge for the circuit-breaker symptom stream.
telemetry-bridge = ["dep:aether-telemetry"]
