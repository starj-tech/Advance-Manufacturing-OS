# AETHER-OS local dev environment — protocol brokers + mock
# external services so integration tests against OPC-UA, MQTT,
# and the commodity feed can run without provisioning anything
# off-machine.
#
# Usage:
#
#   docker compose -f docker-compose.dev.yml up -d
#   cargo test --workspace --features integration-tests
#   docker compose -f docker-compose.dev.yml down
#
# Every image below is a free public registry image. No paid
# services are referenced. Ports map to localhost defaults so
# the workspace's existing Bridge config (`OpcUaConfig::default`,
# etc.) connects without overrides.
#
# What this environment provides:
#
#   * opcua — Eclipse Milo demo server on 4840. Standard
#     namespace + a few simulated nodes for subscription tests.
#   * mqtt — Mosquitto 2.x with anonymous access on 1883 and
#     TLS on 8883 (TLS uses a self-signed cert mounted from
#     `infra/dev-certs/`).
#   * commodity-mock — wiremock-rs based fake Alpha Vantage
#     endpoint on 9100. Returns canned responses for the
#     commodities AV publishes; tests point AlphaVantageFeed
#     at this via `with_base_url("http://localhost:9100")`.
#   * sqlite-browser — DBeaver-compatible SQLite gateway on
#     8080 for inspecting the local SQLite mirror during
#     development.
#
# What this environment does NOT provide:
#
#   * A real Supabase. The Supabase CLI's local stack runs
#     separately via `supabase start` (free, MIT-licensed) —
#     not embedded here because the CLI manages its own
#     network and config we'd otherwise duplicate.
#   * Production-grade signing certificates. The cert mounted
#     into Mosquitto is a self-signed dev cert generated by
#     `infra/dev-certs/generate.sh`.
#   * Mobile build runners. iOS / Android builds need real
#     SDKs that don't live in containers.

version: "3.9"

services:
  # ---------- OPC-UA: Eclipse Milo demo server ----------
  # Image is free, Eclipse Public License 2.0. The server
  # exposes a standard simulated namespace under
  # `ns=2;s=HelloWorld` plus a counter node useful for testing
  # `OpcUaBridge::subscribe` against a live publish interval.
  opcua:
    image: iotechsys/iotech-opcua-server:latest
    container_name: aether-dev-opcua
    ports:
      - "4840:4840"
    restart: unless-stopped
    healthcheck:
      # Eclipse Milo's discovery endpoint speaks raw TCP; a
      # simple connect-then-close is the cheapest health
      # probe.
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/127.0.0.1/4840 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- MQTT: Eclipse Mosquitto ----------
  # Anonymous on 1883 (matches `MqttConfig::default()`),
  # password+TLS on 8883 when integration tests need to
  # exercise the secured path.
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: aether-dev-mqtt
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./infra/dev-certs:/mosquitto/certs:ro
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/#' -C 1 -W 2 || exit 1"
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Commodity feed mock ----------
  # WireMock standalone — minimal Java image hosting canned
  # JSON responses for AlphaVantageFeed integration tests.
  # The mappings file under `infra/wiremock/` defines the
  # response shape for each commodity function.
  commodity-mock:
    image: wiremock/wiremock:3.9.1-alpine
    container_name: aether-dev-commodity
    ports:
      - "9100:8080"
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./infra/wiremock:/home/wiremock:ro
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--quiet"
        - "--spider"
        - "http://127.0.0.1:8080/__admin/health"
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- SQLite browser (read-only) ----------
  # Useful for inspecting the local mirror during dev — the
  # outbox / actuator_commands rows are visible without
  # leaving the editor.
  sqlite-browser:
    image: linuxserver/sqlitebrowser:latest
    container_name: aether-dev-sqlite-ui
    ports:
      - "8080:3000"
    volumes:
      - ./target/dev-data:/data
    environment:
      - PUID=1000
      - PGID=1000
    restart: unless-stopped

networks:
  default:
    name: aether-dev
