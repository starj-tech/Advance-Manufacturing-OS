# Dev-only Mosquitto config — matches the workspace's
# `MqttConfig::default()` so `MqttBridge` connects out of the
# box. NOT FOR PRODUCTION — anonymous listener is enabled
# alongside the TLS listener; production must remove the
# anonymous one.

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Anonymous broker for fast local iteration. Matches the
# rumqttc client's default unauthenticated connect.
listener 1883
allow_anonymous true

# TLS listener for tests that exercise the secured path. The
# cert is generated by infra/dev-certs/generate.sh; do NOT
# check the .pem files in.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
password_file /mosquitto/config/passwd
