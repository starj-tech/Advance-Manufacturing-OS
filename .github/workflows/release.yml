# Cross-OS signed-release pipeline.
#
# Triggered by pushing a semver tag (`v0.x.y` or `v0.x.y-rcN`).
# Builds installers for macOS x86_64+aarch64, Windows x86_64,
# and Linux x86_64+aarch64 in parallel, uploads them as GitHub
# release artifacts, and (when the relevant signing secrets are
# present) signs + notarizes each platform's artifact.
#
# ## Why this lives here rather than waiting for code-signing
# The CI matrix shape is a deliverable in its own right — even
# without real signing certificates, having the build pipeline
# wired means a tagged tag in this repo immediately produces
# reproducible cross-OS artifacts that QA can install and
# smoke-test. Signing is layered on top by setting the secrets
# documented below; without them the pipeline still produces
# unsigned artifacts and uploads them with a UNSIGNED marker in
# the release notes.
#
# ## Secrets the signing steps look for (all optional)
# - APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / KEYCHAIN_PASSWORD
#   APPLE_NOTARY_ACCOUNT / APPLE_NOTARY_PASSWORD / APPLE_NOTARY_TEAM
# - WINDOWS_PFX_BASE64 / WINDOWS_PFX_PASSWORD
# - LINUX_GPG_PRIVATE_KEY / LINUX_GPG_PASSPHRASE
#
# Real signing certs are procured outside this repo (Apple Dev
# ID, DigiCert / Sectigo EV cert, GPG key in a YubiHSM). Adding
# them flips the conditional steps from "skip with marker" to
# "sign and verify."

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  rust-test:
    name: Pre-release · cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests (excluding GTK-bound desktop)
        run: cargo test --workspace --exclude aether-desktop --all-targets

  build:
    name: Build · ${{ matrix.target }}
    needs: rust-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_glob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: aether-desktop-macos-aarch64.dmg
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_glob: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: aether-desktop-macos-x86_64.dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_glob: target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            artifact_name: aether-desktop-windows-x86_64.msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_glob: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            artifact_name: aether-desktop-linux-x86_64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install

      # Linux only: GTK + webkit2gtk for Tauri.
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Tauri build (unsigned)
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          # Tauri build looks at these; signing-on if present.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_ACCOUNT }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM }}

      # macOS notarization is a separate step after the build
      # produces the .dmg. Conditional on the notarytool secrets
      # being set so unsigned builds still complete cleanly.
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_NOTARY_ACCOUNT != ''
        env:
          APPLE_NOTARY_ACCOUNT: ${{ secrets.APPLE_NOTARY_ACCOUNT }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM: ${{ secrets.APPLE_NOTARY_TEAM }}
        run: |
          DMG=$(ls ${{ matrix.artifact_glob }} | head -n1)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_NOTARY_ACCOUNT" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_NOTARY_TEAM" \
            --wait
          xcrun stapler staple "$DMG"

      # Windows signing via signtool.exe. The PFX is checked
      # into the runner from a base64-encoded secret.
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_PFX_BASE64 != ''
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64)
          [IO.File]::WriteAllBytes("cert.pfx", $pfx)
          $msi = (Get-ChildItem "${{ matrix.artifact_glob }}" | Select-Object -First 1).FullName
          & signtool sign /f cert.pfx /p $env:WINDOWS_PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 $msi

      # Linux .deb gets a detached GPG signature alongside the
      # binary — `dpkg` consumers can verify against the
      # published public key.
      - name: Sign (Linux)
        if: runner.os == 'Linux' && env.LINUX_GPG_PRIVATE_KEY != ''
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          echo "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          DEB=$(ls ${{ matrix.artifact_glob }} | head -n1)
          gpg --batch --yes --passphrase "$LINUX_GPG_PASSPHRASE" \
            --detach-sign --armor --output "${DEB}.sig" "$DEB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    name: Publish · GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Stage flat dist directory
        run: |
          mkdir -p flat
          find dist -type f -exec cp {} flat/ \;
          ls -la flat/

      - name: Compose release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          {
            echo "# AETHER-OS ${tag}"
            echo
            echo "## Artifacts"
            for f in flat/*; do
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
            done
            echo
            if [ -z "${{ secrets.APPLE_NOTARY_ACCOUNT }}" ] \
               || [ -z "${{ secrets.WINDOWS_PFX_BASE64 }}" ] \
               || [ -z "${{ secrets.LINUX_GPG_PRIVATE_KEY }}" ]; then
              echo "**UNSIGNED**: one or more signing secrets are not configured."
              echo "Production builds require all platform signing keys."
            else
              echo "All platforms signed: macOS notarized, Windows Authenticode, Linux GPG."
            fi
          } > NOTES.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: NOTES.md
          files: flat/*
          draft: true
          prerelease: ${{ contains(steps.notes.outputs.tag, '-rc') }}
