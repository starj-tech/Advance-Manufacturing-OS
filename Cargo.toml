[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/aether-core",
    "crates/aether-db",
    "crates/aether-sync",
    "crates/aether-crypto",
    "crates/aether-opcua",
    "crates/aether-mqtt",
    "crates/aether-protocols",
    "crates/aether-modules",
    "crates/aether-safety",
    "crates/aether-telemetry",
    "crates/aether-discovery",
    "crates/aether-healing",
    "crates/aether-hedging",
    "crates/aether-money",
    "crates/aether-industry",
    "crates/aether-compliance",
    "crates/aether-actuators",
    "crates/aether-vision",
    "tools/opcua-mock-server",
    "tools/module-signer-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "MIT"
publish = false
authors = ["AETHER-OS Engineering"]
repository = "https://github.com/starj-tech/advance-manufacturing-os"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1.3"

# Error handling
thiserror = "1"
anyhow = "1"

# Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto
chacha20poly1305 = "0.10"
argon2 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
crypto_box = { version = "0.9", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rand_core = { version = "0.6", features = ["std"] }
getrandom = "0.2"
zeroize = { version = "1", features = ["derive"] }
bip39 = { version = "2", default-features = false, features = ["std"] }

# Identifiers + time
uuid = { version = "1", features = ["v4", "v7", "serde"] }
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uhlc = "0.7"

# Property-based testing
proptest = "1"

# CRDT
automerge = "0.5"

# Industrial protocols
opcua = { version = "0.13", default-features = false, features = ["client"] }
rumqttc = "0.24"

# Networking + discovery
mdns-sd = "0.11"
btleplug = "0.11"

# HTTP client for the Supabase-backed reconciler. rustls-tls keeps us
# off OpenSSL so the cross-OS release matrix doesn't depend on a system
# libssl version. `json` pulls in serde_json integration.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# In-process HTTP mock server for reconciler/transport tests. Lets us
# assert wire-level contracts (request method, path, headers, body)
# without standing up a real Supabase project.
wiremock = "0.6"

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

# CLI
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
