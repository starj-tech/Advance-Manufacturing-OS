[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Transitive advisories with no maintained drop-in upgrade available. Each
# is scoped to a dependency we cannot currently replace; re-evaluate when
# the upstream crate publishes a fix. (The former Tauri/GTK3 ignore family
# was dropped when the desktop shell was retired in favor of the web SPA.)
ignore = [
    # fxhash: unmaintained, pulled transitively via automerge (aether-sync
    # CRDT merge). No safe upgrade — automerge has not switched to
    # rustc-hash yet. Revisit when automerge bumps.
    "RUSTSEC-2025-0057",
    # rsa: Marvin timing side-channel. Pulled only by sqlx-mysql (sqlx's
    # macros graph) — we use the sqlite backend exclusively, so the
    # vulnerable RSA path is never reached. No fixed upgrade exists.
    "RUSTSEC-2023-0071",
    # paste: unmaintained proc-macro pulled via nalgebra → simba
    # (aether-robotics kinematics). No maintained drop-in; revisit on a
    # nalgebra bump.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.93

# Skip license check for our own internal crates (they inherit license
# = "MIT" + publish = false from the workspace).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Internal workspace path dependencies are wildcards by design — they
# resolve via the single workspace Cargo.lock.
wildcards = "allow"
highlight = "all"
